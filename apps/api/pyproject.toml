[project]
name = "ama-api"
version = "0.1.0"
description = "Common API for the Agentic Marketing Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.147.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.5",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.0",
  "pyjwt==2.15.1",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "phonenumbers==9.0.41",
  "python-multipart==0.0.32",
  "celery[redis]==5.6.3",
  "redis==6.4.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "fakeredis==2.40.0",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "types-requests==2.33.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]
"migrations/**" = ["E501", "S105"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["migrations", "tests"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "manual: tests that call a real paid provider and are skipped by default",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/celery_app.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
